[project]
name = "ast-everything"
version = "0.2.0"
description = "Python and Markdown files as add-only, versioned node/edge graphs in MongoDB Atlas, and the search over them"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0",
    "pymongo>=4.10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "mongomock>=4.3",
    "pytest>=8",
    "pytest-xdist>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ast_everything"]

[tool.pytest.ini_options]
testpaths = ["tests"]
