[project]
name = "agent-api"
version = "0.1.0"
description = "SecondBrain agent API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "sse-starlette>=2.0",
    "pydantic>=2.0",
    "ddgs>=9.0",
    "secondbrain-harness",
    "flows",
    "ast-everything",
    "temporalio>=1.0,<2",
]

[dependency-groups]
dev = [
    "mongomock>=4.3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3",
]

[tool.uv]
package = false

[tool.uv.sources]
# Workspace members (root pyproject.toml); installed editable.
secondbrain-harness = { workspace = true }
flows = { workspace = true }
ast-everything = { workspace = true }
