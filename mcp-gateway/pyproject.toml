[project]
name = "mcp-gateway"
version = "0.1.0"
description = "SecondBrain MCP gateway: one MCP server for the guest, one client per upstream, policy, pins"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28,<2",
    "starlette>=0.40",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.0",
    "secondbrain-harness",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3",
]

[tool.uv]
package = false

[tool.uv.sources]
# Workspace member (root pyproject.toml), editable like for agent-api, so
# harness/protocol changes need no reinstall. Uses protocol.canonical and
# protocol.mcp.
secondbrain-harness = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
