[project]
name = "code-index-mcp"
version = "0.1.0"
description = "MCP server: a code graph and name search over one Python repo, after LocAgent"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28,<2",
    "uvicorn>=0.34",
    "bm25s>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
