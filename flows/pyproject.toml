[project]
name = "flows"
version = "0.0.1"
description = "SecondBrain Temporal control plane: session workflow, activities, schedules, worker"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flows"]

[tool.pytest.ini_options]
testpaths = ["flows/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
