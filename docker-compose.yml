services:
  # -- LLM Inference (vLLM) ------------------------------------------------
  # OpenAI-compatible server. Serves /v1/chat/completions and /health on :8080,
  # so the URL contract with agent-api (http://secondbrain-llm:8080) is unchanged.
  llm:
    profiles: ["local-llm"]   # Only starts with: docker compose --profile local-llm up -d llm
    image: vllm/vllm-openai:v0.11.0
    container_name: secondbrain-llm
    restart: unless-stopped
    ipc: host
    command:
      - "--model=Qwen/Qwen3-14B-AWQ"
      - "--served-model-name=qwen3-14b"
      - "--quantization=awq_marlin"
      - "--dtype=float16"
      - "--max-model-len=32768"
      - "--max-num-seqs=4"
      - "--gpu-memory-utilization=0.85"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=hermes"
      - "--reasoning-parser=qwen3"
      - "--host=0.0.0.0"
      - "--port=8080"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
    volumes:
      - ~/data/SecondBrain/hf_cache:/root/.cache/huggingface
    networks:
      - llm_internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 24G
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(\"http://localhost:8080/health\",timeout=3).status==200 else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # -- Agent API (FastAPI brain) -------------------------------------------
  # CI builds and pushes the image (see .github/workflows/deploy_agent_api.yml);
  # deploys are `docker compose pull agent-api && up -d`. Rollback: retag a
  # previous :<git-sha> image from GHCR.
  agent-api:
    image: ghcr.io/yingliu-data/secondbrain-agent-api:latest
    stop_grace_period: 20s                      # shutdown parks running guests (HARNESS_SHUTDOWN_PARK_S 8 s + snapshot)
    build:
      context: .                                # the uv workspace root: harness/ + flows/ are workspace members
      dockerfile: agent-api/Dockerfile
    container_name: secondbrain-agent-api
    restart: unless-stopped
    environment:
      - LLM_URL=http://secondbrain-llm:8080
      - API_SECRET_KEY=${API_SECRET_KEY}
      - LOG_LEVEL=warning
      - MAX_TOOL_CALLS_PER_TURN=10
      - MAX_INPUT_LENGTH=4096
      - MCP_GATEWAY_URL=http://mcp-gateway:8090
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}          # shared bearer with mcp-gateway (both directions)
      # Harness tenants run through the Temporal session workflow (and the
      # worker runs in this process); unset TEMPORAL_ADDRESS -> direct path.
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=secondbrain
      # Engine `harness` sandbox: one Firecracker microVM per session (the
      # image carries firecracker + mkfs.ext4). Needs /dev/kvm. On a box
      # without KVM set HARNESS_SANDBOX=local in .env AND drop the device
      # with a docker-compose.override.yml (auto-loaded, not committed):
      #   services:
      #     agent-api:
      #       devices: !reset []
      - HARNESS_SANDBOX=${HARNESS_SANDBOX:-firecracker}
      - HARNESS_KERNEL=/opt/harness-image/vmlinux
      - HARNESS_ROOTFS=/opt/harness-image/rootfs.ext4      # IMAGE_VERSION sits next to it
      - HARNESS_WORKSPACE_TEMPLATE=/opt/harness-image/workspace-template.img  # fallback only (mkfs.ext4 is in the image)
      - HARNESS_VM_CACHE=/var/lib/secondbrain/vm            # base/ snapshot lives here
    depends_on:
      temporal:
        condition: service_started               # not healthy: the direct path works without it
    volumes:
      - ./agent-api/data:/root/agent-api/data   # Persistent data (logs, db, tenants.json)
      - /var/run/docker.sock:/var/run/docker.sock  # Auto-start local LLM on fallback
      # Harness VM cache (HARNESS_VM_CACHE default): vmlinux, rootfs.ext4,
      # IMAGE_VERSION, workspace-template.img and the base snapshot in base/.
      # Read-write so `python -m app.host.sandbox.base_snapshot build-base` can
      # (re)build base/ in place (harness/docs/RUNBOOK-M3.md).
      - ~/data/SecondBrain/vm:/var/lib/secondbrain/vm
      # Guest image outputs of `cd harness/image && make image`: vmlinux,
      # rootfs.ext4, workspace-template.img, IMAGE_VERSION. build.sh replaces
      # files by rename, so running VMs keep the old inode; rebuild the base
      # snapshot after a rebuild (harness/docs/RUNBOOK-M3.md).
      - ./harness/image/out:/opt/harness-image:ro
    # Firecracker microVMs for engine `harness`: KVM is required. No
    # /dev/vhost-vsock: Firecracker's vsock is emulated in the VMM over Unix
    # sockets (and compose refuses to start when a listed device is missing).
    devices:
      - /dev/kvm:/dev/kvm
    networks:
      - llm_internal
      - tunnel_network
      - agent-net                               # Shared with wcc-mcp container: http://wcc-mcp:8765
    extra_hosts:
      - "host.docker.internal:host-gateway"     # Reach host-run MCP servers
    # Local LLM (vLLM) is the only provider. Start it with:
    #   docker compose --profile local-llm up -d llm
    # agent-api will auto-start it via the docker.sock mount if it goes down.

  # -- MCP gateway -----------------------------------------------------------
  # One MCP server for the guest (POST /mcp via agent-api's forwarder), one
  # client per upstream MCP server, per-tenant policy, per-session pins
  # (harness/docs/GATEWAY.md). Config: ./mcp-gateway/data/gateway.json
  # (`python -m app.migrate_config tenants.json`); pins persist in
  # ./mcp-gateway/data/gateway-state. Not published on a host port.
  mcp-gateway:
    image: ghcr.io/yingliu-data/secondbrain-mcp-gateway:latest
    build:
      context: .                                # the uv workspace root: harness/ (protocol) is a workspace member
      dockerfile: mcp-gateway/Dockerfile
    container_name: secondbrain-mcp-gateway
    restart: unless-stopped
    environment:
      - GATEWAY_CONFIG=/data/gateway.json
      - GATEWAY_STATE_DIR=/data/gateway-state
      - AGENT_API_URL=http://agent-api:8000
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - LOG_LEVEL=info
    volumes:
      - ./mcp-gateway/data:/data                # gateway.json + gateway-state/pins
    networks:
      - llm_internal                            # agent-api <-> gateway
      - agent-net                               # upstreams: http://wcc-mcp:8765
    extra_hosts:
      - "host.docker.internal:host-gateway"     # host-run MCP servers
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(\"http://localhost:8090/healthz\",timeout=3).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -- Temporal (session workflows, timers, schedules) ----------------------
  # Dev server with a SQLite file on the bind mount and the UI bundled
  # (harness/docs/FLOWS.md). gRPC 7233 is reachable only on llm_internal
  # (agent-api: temporal:7233), never published; the UI is on 127.0.0.1:8233
  # (ssh -L 8233:localhost:8233). The image runs as uid 1000 ("temporal"):
  # first time, `mkdir -p agent-api/data/temporal && sudo chown 1000:1000 agent-api/data/temporal`.
  # Retention 30 days: `docker compose exec temporal temporal operator namespace
  # update --namespace secondbrain --retention 720h` once after the first start.
  temporal:
    image: temporalio/temporal:1.9.1            # CLI 1.9.1 = Server 1.32.0, UI 2.54.1 (spikes/temporal.md)
    container_name: secondbrain-temporal
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --db-filename=/data/temporal.db
      - --namespace=secondbrain
      - --ui-port=8233
      - --log-level=warn
    volumes:
      - ./agent-api/data/temporal:/data         # temporal.db (workflows, histories, schedules)
    ports:
      - "127.0.0.1:8233:8233"                   # UI only, localhost only
    networks:
      - llm_internal                            # agent-api <-> temporal:7233 (internal, no egress)
      - temporal_ui                             # only so the UI port can be published
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -- Cloudflare Tunnel ---------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: secondbrain-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - tunnel_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # -- GPU Monitoring (optional) ---------------------------------------------
  # Exposes GPU metrics at :9400/metrics for Prometheus/Grafana.
  # Safe to remove if GPU monitoring is not needed.
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: secondbrain-dcgm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:9400:9400"  # Localhost only — not exposed to internet
    networks:
      - llm_internal

networks:
  llm_internal:
    driver: bridge
    internal: true    # No internet access for LLM
  tunnel_network:
    driver: bridge
  temporal_ui:
    driver: bridge    # temporal only: a container on internal networks alone cannot publish a port
  agent-net:
    external: true    # Created once on the VM (docker network create agent-net); wcc-mcp joins it too
