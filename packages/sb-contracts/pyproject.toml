[project]
name = "sb-contracts"
version = "0.1.0"
description = "Shared vocabulary for SecondBrain services: enums, wire/value types, and the interfaces agent-api and mcp-gateway must agree on."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sb_contracts"]

[tool.mypy]
strict = true
python_version = "3.12"
