name: Test

# The four suites against the one workspace lock (root pyproject.toml +
# uv.lock), one job per suite, plus a guest-image smoke test. Each suite is
# its own pytest process: agent-api and mcp-gateway both have a top-level
# `app` package, and harness/tests is a package. Every suite runs under
# pytest-xdist (-n auto; each worker process starts its own Temporal test
# server where a suite needs one).
#
# The image workflows (deploy_agent_api.yml, build_mcp_gateway.yml) call this
# workflow (workflow_call) with their own suite instead of keeping a copy of
# the test job.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      suites:
        description: 'JSON list of suites to run (default: all four, plus guest.pyz)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call: a call from an
  # image workflow never cancels this workflow's own run of the same ref
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites || '["harness", "flows", "agent-api", "mcp-gateway"]') }}
    env:
      UV_FROZEN: '1'                              # never re-resolve in CI
      API_SECRET_KEY: ci-test                     # agent-api's config reads it at import
      # the workspace member's package name (harness/ is secondbrain-harness)
      PACKAGE: ${{ matrix.suite == 'harness' && 'secondbrain-harness' || matrix.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'                       # = the Dockerfiles' uv image
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace (the suite's member + its dev group)
        run: uv sync --frozen --package "$PACKAGE"

      - name: pytest
        working-directory: ${{ matrix.suite }}
        run: uv run --frozen pytest -q -n auto

  guest-pyz:
    # Guest image smoke test: only the stdlib zipapp (no rootfs/kernel, so
    # not `build.sh check`, which requires them); these are its pyz checks.
    if: ${{ !inputs.suites }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace (harness)
        run: uv sync --frozen --package secondbrain-harness

      - name: guest.pyz
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          harness/image/build.sh pyz
          "$PYTHON" harness/image/out/guest.pyz --help > /dev/null
          "$PYTHON" -c "import sys; sys.path.insert(0, 'harness/image/out/guest.pyz'); import guest, protocol, guest.main"
          echo "guest.pyz: --help ok; guest + protocol import"
