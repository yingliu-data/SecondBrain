name: Test

# All four suites against the one workspace lock (root pyproject.toml +
# uv.lock), plus a guest-image smoke test. Each suite is its own pytest
# process: agent-api and mcp-gateway both have a top-level `app` package,
# and harness/tests is a package.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: '1'                              # never re-resolve in CI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'                       # = the Dockerfiles' uv image
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace (all members, dev groups)
        run: uv sync --frozen --all-packages

      - name: harness
        working-directory: harness
        run: uv run pytest -q

      - name: flows
        working-directory: flows
        run: uv run pytest -q

      - name: agent-api
        working-directory: agent-api
        env:
          API_SECRET_KEY: ci-test
        run: uv run pytest -q

      - name: mcp-gateway
        working-directory: mcp-gateway
        run: uv run pytest -q

      # Guest image smoke test: only the stdlib zipapp (no rootfs/kernel, so
      # not `build.sh check`, which requires them); these are its pyz checks.
      - name: guest.pyz
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          harness/image/build.sh pyz
          "$PYTHON" harness/image/out/guest.pyz --help > /dev/null
          "$PYTHON" -c "import sys; sys.path.insert(0, 'harness/image/out/guest.pyz'); import guest, protocol, guest.main"
          echo "guest.pyz: --help ok; guest + protocol import"
