name: Build MCP Gateway

# Test, then build and push ghcr.io/yingliu-data/secondbrain-mcp-gateway
# (the `image:` in docker-compose.yml). No deploy step: on the VM,
# `docker compose pull mcp-gateway && docker compose up -d --no-deps mcp-gateway`.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mcp-gateway/**'
      - 'harness/protocol/**'
      - 'harness/pyproject.toml'
      - 'pyproject.toml'                          # workspace root + the one lock
      - 'uv.lock'
      - '.github/workflows/build_mcp_gateway.yml'
  push:
    branches:
      - main
    paths:
      - 'mcp-gateway/**'
      - 'harness/protocol/**'
      - 'harness/pyproject.toml'
      - 'pyproject.toml'                          # workspace root + the one lock
      - 'uv.lock'
      - '.github/workflows/build_mcp_gateway.yml'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.12.3'
          cache-dependency-glob: uv.lock

      # The workspace lock, synced for this member only (test.yml runs
      # every suite).
      - name: Sync workspace (mcp-gateway)
        run: uv sync --frozen --package mcp-gateway

      - name: Run tests
        working-directory: mcp-gateway
        run: uv run --frozen pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Repo root: the uv workspace (mcp-gateway/Dockerfile).
          context: .
          file: mcp-gateway/Dockerfile
          platforms: linux/amd64
          # Only publish from main; PRs just prove the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/yingliu-data/secondbrain-mcp-gateway:latest
            ghcr.io/yingliu-data/secondbrain-mcp-gateway:${{ github.sha }}
          cache-from: type=gha,scope=mcp-gateway
          cache-to: type=gha,mode=max,scope=mcp-gateway
